CALYTRON: SINGLE-FILE DEPLOY NOTES
1) Supabase > SQL Editor > run this once:
- - Run once in Supabase: SQL Editor > New query > Run
create table if not exists public.app_state (
  user_id    uuid primary key references auth.users(id) on delete cascade,
  data       jsonb not null default '{}'::jsonb,
  updated_at timestamptz not null default now()
);
alter table public.app_state enable row level security;

drop policy if exists "own row: select" on public.app_state;
drop policy if exists "own row: insert" on public.app_state;
drop policy if exists "own row: update" on public.app_state;
drop policy if exists "own row: delete" on public.app_state;
create policy "own row: select" on public.app_state for select to authenticated using ((select auth.uid()) = user_id);
create policy "own row: insert" on public.app_state for insert to authenticated with check ((select auth.uid()) = user_id);
create policy "own row: update" on public.app_state for update to authenticated using ((select auth.uid()) = user_id) with check ((select auth.uid()) = user_id);
create policy "own row: delete" on public.app_state for delete to authenticated using ((select auth.uid()) = user_id);
revoke all on public.app_state from anon;

2) Supabase > Authentication > URL Configuration: set Site URL to your final domain (and add it to Redirect URLs).
3) Paste your Project URL and anon key into window.CALYTRON_CONFIG near the top of this file.

<script defer src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const NAV=[
 ['dashboard','⌂','Dashboard'],['sales','▤','Sales'],['menu','◫','Menu Profit'],['food','◉','Food Cost'],['inventory','▦','Inventory'],['purchases','↗','Purchases'],['waste','♲','Waste'],['expenses','−','Expenses'],['labor','♙','Labor'],['cash','▣','Cash Control'],['suppliers','♢','Suppliers'],['invoices','▣','Invoice Center'],['reports','▥','Reports'],['profit','◈','Profit Center'],['alerts','!','Alerts'],['settings','⚙','Settings']
];
const KEY='calytron_restaurant_profit_v1';
const seed={
 setup:{restaurant:'Urban Grill',owner:'Demo Owner',country:'Zambia',currency:'ZMW',type:'Restaurant',locations:1,employees:12,foodTarget:30,laborTarget:25,profitTarget:15},
 sales:[
  {id:1,date:today(-0),ref:'UG-1042',item:'Chicken Burger',qty:24,price:85,discount:0,payment:'Mobile Money'},
  {id:2,date:today(-1),ref:'UG-1037',item:'Chicken Pasta',qty:18,price:95,discount:0,payment:'Cash'},
  {id:3,date:today(-2),ref:'UG-1029',item:'Beef Grill',qty:14,price:140,discount:0,payment:'Card'}
 ],
 menu:[
  {id:1,name:'Chicken Burger',cat:'Mains',price:85,pack:4,other:0,target:55,ings:[{name:'Chicken',qty:0.18,cost:60},{name:'Bun',qty:1,cost:8},{name:'Vegetables',qty:1,cost:5},{name:'Sauce',qty:1,cost:3}]},
  {id:2,name:'Chicken Pasta',cat:'Mains',price:95,pack:3,other:0,target:55,ings:[{name:'Chicken',qty:0.16,cost:60},{name:'Pasta',qty:.15,cost:32},{name:'Sauce',qty:1,cost:5}]},
  {id:3,name:'Beef Grill',cat:'Mains',price:140,pack:5,other:0,target:55,ings:[{name:'Beef',qty:.25,cost:120},{name:'Vegetables',qty:1,cost:5},{name:'Sauce',qty:1,cost:3}]},
  {id:4,name:'Fresh Juice',cat:'Drinks',price:35,pack:1,other:0,target:60,ings:[{name:'Fruit',qty:.3,cost:25},{name:'Sugar',qty:.02,cost:20}]}
 ],
 inventory:[
  {id:1,name:'Chicken',cat:'Protein',unit:'kg',qty:32,min:20,max:60,cost:60,supplier:'Fresh Foods'},
  {id:2,name:'Beef',cat:'Protein',unit:'kg',qty:18,min:15,max:45,cost:120,supplier:'Meat House'},
  {id:3,name:'Bun',cat:'Bakery',unit:'pcs',qty:84,min:50,max:180,cost:8,supplier:'City Bakery'},
  {id:4,name:'Pasta',cat:'Dry Goods',unit:'kg',qty:9,min:8,max:25,cost:32,supplier:'Foodlink'}
 ],
 purchases:[{id:1,date:today(-2),supplier:'Fresh Foods',item:'Chicken',qty:50,unit:'kg',unitCost:60,total:3000}],
 waste:[{id:1,date:today(-1),item:'Chicken',qty:2,unit:'kg',cost:120,reason:'Overproduction',staff:'Kitchen',location:'Main'}],
 expenses:[{id:1,date:today(-1),desc:'Utilities',cat:'Utilities',amount:900,payment:'Bank Transfer',note:''},{id:2,date:today(-2),desc:'Marketing',cat:'Marketing',amount:500,payment:'Mobile Money',note:''}],
 labor:[{id:1,name:'Maria Banda',role:'Kitchen',rate:35,hours:8,overtime:0,date:today(-1)},{id:2,name:'James Phiri',role:'Service',rate:28,hours:8,overtime:0,date:today(-1)}],
 cash:[{id:1,date:today(-1),opening:1000,cash:5100,card:1800,mobile:2400,delivery:0,other:0,till:10,actual:10280}],
 suppliers:[{id:1,name:'Fresh Foods',contact:'',items:'Chicken, Vegetables'},{id:2,name:'Meat House',contact:'',items:'Beef'}]
};
let db;
try{db=JSON.parse(localStorage.getItem(KEY)||'null')||JSON.parse(JSON.stringify(seed))}catch(e){db=JSON.parse(JSON.stringify(seed))}
const COLLECTIONS=['sales','menu','inventory','purchases','waste','expenses','labor','cash','suppliers','invoices'];
COLLECTIONS.forEach(k=>{if(!Array.isArray(db[k]))db[k]=[]});
db.setup=Object.assign({},seed.setup,db.setup||{});
db.invoices=db.invoices||[];
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Could not save: browser storage is full or blocked.')}}
function today(offset=0){let d=new Date();d.setDate(d.getDate()+offset);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function money(n){let c=db.setup.currency||'ZMW';let sym={ZMW:'K',USD:'$',ZAR:'R',KES:'KSh',NGN:'₦',GHS:'GH₵',BWP:'P',TZS:'TSh',UGX:'USh',RWF:'RF',MWK:'MK',MZN:'MT'}[c]||c;return sym+' '+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
function sum(a,fn){return a.reduce((s,x)=>s+(fn?fn(x):x),0)}
function revenue(){return sum(db.sales,x=>x.qty*x.price-(x.discount||0))}
function expenses(){return sum(db.expenses,x=>+x.amount||0)}
function wasteCost(){return sum(db.waste,x=>+x.cost||0)}
function laborCost(){return sum(db.labor,x=>(+x.rate||0)*(+x.hours||0)+((+x.overtime||0)*(+x.rate||0)*1.5))}
function recipeCost(m){return sum(m.ings||[],i=>(+i.qty||0)*(+i.cost||0))+(+m.pack||0)+(+m.other||0)}
function menuSales(name){return sum(db.sales,x=>x.item===name?+x.qty:0)}
function menuProfit(m){return m.price-recipeCost(m)}
function grossProfit(){return revenue()-sum(db.sales,x=>{let m=db.menu.find(m=>m.name===x.item);return m?recipeCost(m)*x.qty:0})}
function foodPct(){let r=revenue();return r?((r-grossProfit())/r*100):0}
function laborPct(){let r=revenue();return r?laborCost()/r*100:0}
function health(){
 let f=db.setup.foodTarget||30,l=db.setup.laborTarget||25;
 let score=70;
 if(foodPct()<=f)score+=10;else score-=Math.min(15,(foodPct()-f));
 if(laborPct()<=l)score+=8;else score-=Math.min(10,(laborPct()-l));
 if(revenue()>0)score+=Math.min(7,grossProfit()/revenue()*10);
 if(wasteCost()===0)score+=5;else score-=Math.min(8,wasteCost()/Math.max(revenue(),1)*100);
 return Math.max(0,Math.min(100,Math.round(score)));
}
function fmtDate(s){return new Date(s+'T00:00:00').toLocaleDateString(undefined,{day:'2-digit',month:'short',year:'numeric'})}
function renderNav(){
 document.getElementById('nav').innerHTML=NAV.map(n=>`<button data-nav="${n[0]}" onclick="showView('${n[0]}')"><i>${n[1]}</i>${n[2]}</button>`).join('');
}
function showView(id){
 document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
 document.getElementById(id).classList.add('active');
 document.querySelectorAll('[data-nav]').forEach(x=>x.classList.toggle('active',x.dataset.nav===id));
 document.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('active',x.dataset.m===id));
 document.getElementById('pageTitle').textContent=NAV.find(x=>x[0]===id)?.[2]||'Dashboard';
 document.getElementById('sidebar').classList.remove('open');
 render(id);
}
function render(id){({dashboard:renderDashboard,sales:renderSales,menu:renderMenu,food:renderFood,inventory:renderInventory,purchases:renderPurchases,waste:renderWaste,expenses:renderExpenses,labor:renderLabor,cash:renderCash,suppliers:renderSuppliers,invoices:renderInvoices,reports:renderReports,profit:renderProfit,alerts:renderAlerts,settings:renderSettings}[id]||renderDashboard)()}

function moduleTabs(items,active){return `<div class="moduleTabs" role="tablist">${items.map((x,i)=>`<button type="button" class="moduleTab ${x[0]===active?'active':''}" onclick="switchModuleTab('${esc(x[0])}')" role="tab" aria-selected="${x[0]===active}">${x[1]}${x[2]?`<span class="count">${x[2]}</span>`:''}</button>`).join('')}</div>`}
function switchModuleTab(id){document.querySelectorAll('.moduleTab').forEach(b=>{let on=b.textContent.trim().toLowerCase().startsWith(id.toLowerCase().split('-')[0]);b.classList.toggle('active',on);b.setAttribute('aria-selected',on)});document.querySelectorAll('.modulePanel').forEach(p=>p.classList.toggle('active',p.dataset.panel===id));}

function shell(title,sub,buttons=''){return `<div class="hero"><div><h2>${title}</h2><p>${sub}</p></div><div class="actions">${buttons}</div></div>`}
function card(label,value,sub,cls=''){return `<div class="card metric"><div class="label">${label}</div><div class="value ${cls}">${value}</div><div class="sub">${sub||''}</div></div>`}
function renderDashboard(){
 let hp=health(), gp=grossProfit(), net=gp-expenses()-laborCost()-wasteCost(), f=foodPct(), l=laborPct();
 let alerts=[];
 if(f>db.setup.foodTarget)alerts.push({t:'Food Cost Above Target',d:`Current ${f.toFixed(1)}% vs target ${db.setup.foodTarget}%. Review recipe costs, portions and supplier prices.`,c:'bad'});
 if(l>db.setup.laborTarget)alerts.push({t:'Labor Cost Above Target',d:`Current ${l.toFixed(1)}% vs target ${db.setup.laborTarget}%. Review staffing and shift hours.`,c:'warn'});
 if(wasteCost()>0)alerts.push({t:'Waste Is Costing You Money',d:`Recorded waste is ${money(wasteCost())}. Investigate the top causes before they repeat.`,c:'bad'});
 if(!alerts.length)alerts.push({t:'No Critical Alerts',d:'Your current recorded data is within the configured thresholds.',c:'good'});
 let chart=lastDaysChart();
 document.getElementById('dashboard').innerHTML=shell('Good morning, '+(db.setup.owner||'Owner'),`Here is the current financial health of ${db.setup.restaurant}.`, `<button class="btn" onclick="loadDemo()">Reset Demo</button><button class="btn primary" onclick="openQuick()">＋ Add Data</button>`)+
 `<div class="grid cards">${card('Recorded Sales',money(revenue()),'All recorded sales')} ${card('Gross Profit',money(gp),'Revenue less recipe cost',gp>=0?'good':'bad')} ${card('Food Cost',f.toFixed(1)+'%',`Target ${db.setup.foodTarget}%`,f<=db.setup.foodTarget?'good':'bad')} ${card('Net Profit Estimate',money(net),'After expenses, labor and waste',net>=0?'good':'bad')}</div>
 <div class="grid two" style="margin-top:16px"><div class="card"><div class="sectionTitle">Sales Trend</div>${chart}</div><div class="card"><div class="sectionTitle">Restaurant Health</div><div class="score"><div class="ring" style="--score:${hp}%"><b>${hp}</b></div><div style="flex:1"><b>${hp>=80?'Healthy operating position':hp>=60?'Needs attention':'Immediate attention required'}</b><p style="color:var(--muted);font-size:12px">Based on profitability, food cost, labor, waste and recorded operating data.</p></div></div></div></div>
 <div class="grid two" style="margin-top:16px"><div class="card"><div class="sectionTitle">Attention Required</div>${alerts.map(a=>`<div class="alert ${a.c==='warn'?'warn':''}"><b>${a.t}</b><small>${a.d}</small></div>`).join('')}</div><div class="card"><div class="sectionTitle">Today's Priorities</div>${priorities(f,l).map((p,i)=>`<div style="display:flex;gap:10px;margin:12px 0"><b>${i+1}</b><span>${p}</span></div>`).join('')}</div></div>
 <div class="card" style="margin-top:16px"><div class="sectionTitle">CALYTRON Profit Intelligence</div><div class="grid three"><div><b>Profit Opportunity</b><div style="font-size:22px;margin-top:4px">${money(Math.max(0,(db.setup.foodTarget-f)*revenue()/100)+Math.max(0,(db.setup.laborTarget-l)*revenue()/100)+wasteCost())}</div><small style="color:var(--muted)">Estimated recoverable opportunity from recorded variance</small></div><div><b>Top Menu Risk</b><div style="margin-top:4px">${esc(db.menu.filter(m=>m.price>0).sort((a,b)=>(menuProfit(a)/a.price)-(menuProfit(b)/b.price))[0]?.name||'No menu data')}</div><small style="color:var(--muted)">Lowest recorded margin</small></div><div><b>Next Best Action</b><div style="margin-top:4px">${priorities(f,l)[0]||'Keep recording data'}</div><small style="color:var(--muted)">Based on current records</small></div></div></div><div class="card" style="margin-top:16px"><div class="sectionTitle">Profit Snapshot</div><div class="grid three">${card('Revenue',money(revenue()),'All recorded sales')}${card('Expenses',money(expenses()),'Operating expenses')}${card('Labor',money(laborCost()),`${l.toFixed(1)}% of sales`)}</div></div>`;
}
function priorities(f,l){let a=[];if(f>db.setup.foodTarget)a.push('Review your highest-cost recipes and supplier prices.');if(l>db.setup.laborTarget)a.push('Review labor hours and shift scheduling.');if(wasteCost()>0)a.push('Investigate recorded waste and its causes.');let low=db.menu.filter(m=>m.price>0&&menuProfit(m)/m.price*100<m.target);if(low.length)a.push(`Review ${low.length} low-margin menu item${low.length>1?'s':''}.`);if(!a.length)a=['Keep recording daily sales, costs and waste so the system can detect trends.'];return a.slice(0,4)}
function lastDaysChart(){let vals=[];for(let i=6;i>=0;i--){let d=today(-i),v=sum(db.sales.filter(x=>x.date===d),x=>x.qty*x.price-(x.discount||0));vals.push({d:d.slice(5),v})}let mx=Math.max(1,...vals.map(x=>x.v));return `<div class="chart">${vals.map(x=>`<div class="barCol" title="${money(x.v)}"><span style="height:${Math.max(4,x.v/mx*170)}px"></span><small>${x.d}</small></div>`).join('')}</div>`}
function renderSales(){let total=revenue();let cash=sum(db.sales.filter(x=>x.payment==='Cash'),x=>x.qty*x.price-(x.discount||0));let cardv=sum(db.sales.filter(x=>x.payment==='Card'),x=>x.qty*x.price-(x.discount||0));let mobile=sum(db.sales.filter(x=>x.payment==='Mobile Money'),x=>x.qty*x.price-(x.discount||0));let bank=sum(db.sales.filter(x=>x.payment==='Bank Transfer'),x=>x.qty*x.price-(x.discount||0));document.getElementById('sales').innerHTML=shell('Revenue','Track revenue, channels and sales performance.','<button class="btn primary" onclick="openForm(\'sale\')">＋ Record Sale</button>')+moduleTabs([['overview','Overview'],['transactions','Transactions',db.sales.length],['channels','Payment Mix'],['insights','Revenue Insights']],'overview')+`
<div class="modulePanel active" data-panel="overview"><div class="grid cards">${card('Total Revenue',money(total),'All recorded sales')}${card('Transactions',db.sales.length,'Sales records')}${card('Average Ticket',money(db.sales.length?total/db.sales.length:0),'Revenue per transaction')}${card('Mobile Money',money(mobile),'Recorded mobile-money revenue')}</div><div class="grid two" style="margin-top:16px"><div class="card"><div class="sectionTitle">Revenue Trend</div>${lastDaysChart()}</div><div class="card"><div class="sectionTitle">Revenue Snapshot</div><p>Cash <b>${money(cash)}</b></p><p>Card <b>${money(cardv)}</b></p><p>Mobile Money <b>${money(mobile)}</b></p><p>Bank Transfer <b>${money(bank)}</b></p></div></div></div>
<div class="modulePanel" data-panel="transactions"><div class="card">${table(db.sales,[['date','Date'],['ref','Reference'],['item','Menu Item'],['qty','Qty'],['price','Price'],['payment','Payment']],x=>`<button class="btn sm danger" onclick="del('sales',${x.id},'sale')">Delete</button>`)}</div></div>
<div class="modulePanel" data-panel="channels"><div class="card"><div class="sectionTitle">Payment Mix</div><div class="insightGrid"><div class="insightCard"><b>Cash</b><strong>${money(cash)}</strong><small>${total?((cash/total)*100).toFixed(1):0}% of revenue</small></div><div class="insightCard"><b>Card</b><strong>${money(cardv)}</strong><small>${total?((cardv/total)*100).toFixed(1):0}% of revenue</small></div><div class="insightCard"><b>Mobile Money</b><strong>${money(mobile)}</strong><small>${total?((mobile/total)*100).toFixed(1):0}% of revenue</small></div></div></div></div>
<div class="modulePanel" data-panel="insights"><div class="card"><div class="sectionTitle">Revenue Insights</div><div class="insightGrid"><div class="insightCard"><b>Top Menu Item</b><strong>${topSeller()}</strong><small>Based on recorded sales volume.</small></div><div class="insightCard"><b>Average Transaction</b><strong>${money(db.sales.length?total/db.sales.length:0)}</strong><small>Higher ticket size can improve revenue without increasing transaction count.</small></div><div class="insightCard"><b>Next Action</b><strong>${db.sales.length?'Review your best-selling items':'Record your first sales'}</strong><small>Use recorded revenue data to identify opportunities.</small></div></div></div></div>`}

function renderMenu(){document.getElementById('menu').innerHTML=shell('Menu Profit','Build a complete menu, cost every dish and engineer profitability.','<button class="btn" onclick="openMenuBuilder()">＋ Menu Builder</button><button class="btn primary" onclick="openForm(\'menu\')">＋ Add Menu Item</button>')+
`<div class="card" style="margin-bottom:16px"><div class="sectionTitle">Menu Builder</div><div style="color:var(--muted);font-size:13px">Create a complete restaurant menu in one workflow — choose a structure, add sections and dishes, enter prices and recipe costs, then save everything directly into Menu Engineering.</div></div>
<div class="card">${table(db.menu,[['name','Menu Item'],['cat','Category'],['price','Price'],['_cost','Recipe Cost'],['_profit','Gross Profit'],['_margin','Margin'],['_class','Classification']],m=>`<button class="btn sm" onclick="openForm('menu',${m.id})">Edit</button> <button class="btn sm danger" onclick="del('menu',${m.id},'menu item')">Delete</button>`,m=>({...m,_cost:money(recipeCost(m)),_profit:money(menuProfit(m)),_margin:(m.price?(menuProfit(m)/m.price*100):0).toFixed(1)+'%',_class:(c=>`<span class="pill ${c==='DOG'?'red':c==='PLOW HORSE'?'amber':''}">${c}</span>`)(classify(m))}))}</div>
<div class="card" style="margin-top:16px"><div class="sectionTitle">Menu Engineering</div><div class="grid four" style="grid-template-columns:repeat(4,1fr)">${['STAR','PLOW HORSE','PUZZLE','DOG'].map(c=>`<div style="padding:14px;border:1px solid var(--line);border-radius:12px"><b>${c}</b><div style="color:var(--muted);font-size:12px;margin-top:7px">${db.menu.filter(m=>classify(m)===c).map(m=>esc(m.name)).join(', ')||'None yet'}</div></div>`).join('')}</div></div>`}

let menuBuilderState=null;
const MENU_TEMPLATES={
 'Modern Casual':{sections:['Starters','Mains','Sides','Desserts','Drinks'],items:[['Starters','Chicken Wings'],['Starters','Garlic Bread'],['Mains','Grilled Chicken'],['Mains','Beef Burger'],['Mains','Fish & Chips'],['Sides','French Fries'],['Sides','Coleslaw'],['Desserts','Cheesecake'],['Drinks','Fresh Juice'],['Drinks','Soft Drink']]},
 'African Restaurant':{sections:['Starters','Mains','Traditional Plates','Sides','Drinks','Desserts'],items:[['Starters','Samosa'],['Starters','Chicken Wings'],['Mains','Grilled Chicken'],['Mains','Beef Stew'],['Traditional Plates','Nshima & Beef'],['Traditional Plates','Nshima & Chicken'],['Sides','Chips'],['Sides','Vegetables'],['Drinks','Fresh Juice'],['Drinks','Soft Drink'],['Desserts','Ice Cream']]},
 'Cafe':{sections:['Breakfast','Light Meals','Sandwiches','Bakery','Hot Drinks','Cold Drinks'],items:[['Breakfast','Full Breakfast'],['Breakfast','Eggs & Toast'],['Light Meals','Chicken Salad'],['Sandwiches','Club Sandwich'],['Bakery','Croissant'],['Hot Drinks','Coffee'],['Hot Drinks','Tea'],['Cold Drinks','Fresh Juice']]},
 'Fast Food':{sections:['Burgers','Chicken','Sides','Combos','Drinks','Desserts'],items:[['Burgers','Classic Burger'],['Burgers','Chicken Burger'],['Chicken','Fried Chicken'],['Chicken','Chicken Wings'],['Sides','French Fries'],['Sides','Coleslaw'],['Combos','Burger Combo'],['Drinks','Soft Drink'],['Desserts','Ice Cream']]},
 'Bar & Grill':{sections:['Starters','Grills','Burgers','Sides','Drinks','Desserts'],items:[['Starters','Chicken Wings'],['Grills','Grilled Chicken'],['Grills','Beef Steak'],['Burgers','Beef Burger'],['Sides','Chips'],['Sides','Salad'],['Drinks','Fresh Juice'],['Drinks','Soft Drink'],['Desserts','Ice Cream']]}
};
function freshBuilderItem(cat,name=''){return {id:'b'+Date.now()+Math.random().toString(36).slice(2),name,cat,price:'',target:55,pack:'',other:'',raw:'',description:'',tags:[],popular:0,featured:false};}
function openMenuBuilder(){
 menuBuilderState={name:(db.setup.restaurant||'Restaurant')+' Menu',type:'Modern Casual',currency:db.setup.currency||'ZMW',sections:[],items:[],step:1,query:'',costDish:null};
 applyMenuTemplate('Modern Casual',true); renderMenuBuilder();
}
function applyMenuTemplate(type,initial=false){
 const t=MENU_TEMPLATES[type]||MENU_TEMPLATES['Modern Casual'];
 menuBuilderState.type=type;menuBuilderState.sections=[...t.sections];
 menuBuilderState.items=t.items.map(x=>freshBuilderItem(x[0],x[1]));
 if(!initial)menuBuilderState.step=1;
 renderMenuBuilder();
}
function addBuilderSection(){
 const n=prompt('Section name (for example: Starters, Mains, Drinks):');
 if(!n||!n.trim())return;const v=n.trim();
 if(menuBuilderState.sections.some(s=>s.toLowerCase()===v.toLowerCase())){alert('That section already exists.');return;}
 menuBuilderState.sections.push(v);renderMenuBuilder();
}
function renameBuilderSection(sec){
 const n=prompt('Rename section:',sec);if(!n||!n.trim()||n.trim()===sec)return;
 const v=n.trim(); if(menuBuilderState.sections.some(s=>s!==sec&&s.toLowerCase()===v.toLowerCase())){alert('That section already exists.');return;}
 menuBuilderState.sections=menuBuilderState.sections.map(s=>s===sec?v:s);menuBuilderState.items.forEach(x=>{if(x.cat===sec)x.cat=v});renderMenuBuilder();
}
function removeBuilderSection(sec){
 if(menuBuilderState.sections.length<=1){alert('Keep at least one section.');return}
 const target=menuBuilderState.sections.find(s=>s!==sec);if(!confirm('Remove this section? Its dishes will move to '+target+'.'))return;
 menuBuilderState.sections=menuBuilderState.sections.filter(s=>s!==sec);menuBuilderState.items.forEach(x=>{if(x.cat===sec)x.cat=target});renderMenuBuilder();
}
function builderSecArg(sec){return encodeURIComponent(sec)}
function moveBuilderSection(sec,dir){const i=menuBuilderState.sections.indexOf(sec),j=i+dir;if(i<0||j<0||j>=menuBuilderState.sections.length)return;[menuBuilderState.sections[i],menuBuilderState.sections[j]]=[menuBuilderState.sections[j],menuBuilderState.sections[i]];renderMenuBuilder()}
function addBuilderItem(cat){const c=cat||menuBuilderState.sections[0]||'Mains';menuBuilderState.items.push(freshBuilderItem(c));menuBuilderState.step=2;renderMenuBuilder()}
function duplicateBuilderItem(id){const x=menuBuilderState.items.find(i=>String(i.id)===String(id));if(!x)return;const copy=JSON.parse(JSON.stringify(x));copy.id='b'+Date.now()+Math.random().toString(36).slice(2);copy.name=(copy.name||'Dish')+' Copy';menuBuilderState.items.push(copy);renderMenuBuilder()}
function removeBuilderItem(id){menuBuilderState.items=menuBuilderState.items.filter(x=>String(x.id)!==String(id));renderMenuBuilder()}
function updateBuilderItem(id,key,val){const x=menuBuilderState.items.find(i=>String(i.id)===String(id));if(x){x[key]=val;if(key==='price'||key==='target'||key==='pack'||key==='other')x[key]=String(val).replace(/[^0-9.]/g,'');}}
function builderCost(x){let c=0;String(x.raw||'').split(/\n/).filter(Boolean).forEach(line=>{let parts=line.split('|');let qty=parseFloat(parts[1])||0,unit=parseFloat(parts[2])||0;c+=Math.max(0,qty)*Math.max(0,unit)});return c+(parseFloat(x.pack)||0)+(parseFloat(x.other)||0)}
function builderMargin(x){let p=parseFloat(x.price)||0,c=builderCost(x);return p?((p-c)/p*100):0}
function builderFilteredItems(){const q=(menuBuilderState.query||'').trim().toLowerCase();return menuBuilderState.items.filter(x=>!q||[x.name,x.cat,x.description,(x.tags||[]).join(' ')].join(' ').toLowerCase().includes(q))}
function builderItemRow(x,i){
 const margin=builderMargin(x),cost=builderCost(x), cls=margin>=(parseFloat(x.target)||55)?'marginGood':'marginBad';
 const tags=(x.tags||[]).map(t=>`<span class="pill">${esc(t)}</span>`).join('');
 return `<div class="dishRow"><div class="dragHandle">↕</div><div><input aria-label="Dish name" value="${esc(x.name)}" oninput="updateBuilderItem('${x.id}','name',this.value)" onchange="renderMenuBuilder()" placeholder="Dish name"><div class="dishMeta">${tags||'No tags'} ${x.featured?' • Featured':''}</div></div><div class="priceCell"><input type="number" min="0" step="0.01" value="${esc(x.price)}" oninput="updateBuilderItem('${x.id}','price',this.value)" onchange="renderMenuBuilder()" placeholder="Price"></div><div class="costCell"><b class="${cls}">${x.price!==''?money(cost):'—'}</b><div class="dishMeta">${x.price!==''?margin.toFixed(1)+'% margin':'Enter price'}</div></div><div class="sectionActions"><button class="btn sm" type="button" onclick="openBuilderDish('${x.id}')">Edit</button><button class="btn sm" type="button" onclick="duplicateBuilderItem('${x.id}')">Copy</button><button class="btn sm danger" type="button" onclick="removeBuilderItem('${x.id}')">×</button></div></div>`;
}

 const groups=menuBuilderState.sections.map(sec=>{const items=menuBuilderState.items.filter(x=>x.cat===sec&&x.name.trim());if(!items.length)return '';return `<div class="previewSection"><h4>${esc(sec)}</h4>${items.map(x=>`<div class="previewItem"><div><b>${esc(x.name)}</b>${x.description?`<div class="previewDesc">${esc(x.description)}</div>`:''}</div><strong>${x.price!==''?money(+x.price):'—'}</strong></div>`).join('')}</div>`}).join('');
 return `<div class="menuPreview"><div class="menuPreviewHeader"><h2>${esc(menuBuilderState.name||'Restaurant Menu')}</h2><div class="dishMeta">${esc(db.setup.restaurant||'Restaurant')} · ${esc(menuBuilderState.currency)}</div></div>${groups||'<div class="empty">Your customer-facing preview will appear here.</div>'}</div>`;
}

iv><div class="actions" style="justify-content:flex-end;margin-top:16px"><button type="button" class="btn" onclick="closeModal();renderMenuBuilder()">Cancel</button><button type="button" class="btn primary" onclick="saveBuilderDish('${x.id}')">Save Dish</button></div>`)
}
function saveBuilderDish(id){const x=menuBuilderState.items.find(i=>String(i.id)===String(id));if(!x)return;x.name=document.getElementById('bd_name').value.trim();x.cat=document.getElementById('bd_cat').value;x.price=document.getElementById('bd_price').value;x.target=document.getElementById('bd_target').value;x.description=document.getElementById('bd_desc').value.trim();x.tags=document.getElementById('bd_tags').value.split(',').map(s=>s.trim()).filter(Boolean).slice(0,8);x.popular=document.getElementById('bd_pop').value;x.pack=document.getElementById('bd_pack').value;x.other=document.getElementById('bd_other').value;x.raw=document.getElementById('bd_raw').value;x.featured=document.getElementById('bd_featured').checked;if(!x.name){alert('Dish name is required.');return}closeModal();renderMenuBuilder()}
function builderHealth(){
 const items=menuBuilderState.items.filter(x=>x.name.trim());
 if(!items.length)return 0;
 let score=0;
 score+=Math.min(25,items.filter(x=>+x.price>0).length/items.length*25);
 score+=Math.min(30,items.filter(x=>builderCost(x)>0).length/items.length*30);
 score+=Math.min(15,items.filter(x=>(x.description||'').trim()).length/items.length*15);
 score+=Math.min(10,items.filter(x=>(x.tags||[]).length).length/items.length*10);
 score+=Math.min(20,items.filter(x=>+x.popular>0).length/items.length*20);
 return Math.round(score);
}
function builderPotential(){
 const items=menuBuilderState.items.filter(x=>x.name.trim()&&+x.price>0);
 return items.reduce((a,x)=>a+(Math.max(0,(+x.price||0)-builderCost(x))*(+x.popular||0)),0);
}
function builderClassification(x){
 const margin=builderMargin(x);const units=+x.popular||0;
 const all=menuBuilderState.items.filter(i=>i.name.trim()).map(i=>+i.popular||0).sort((a,b)=>a-b);
 const median=all.length?all[Math.floor(all.length/2)]:0;
 const highSales=units>0&&units>=Math.max(1,median),highMargin=margin>=(+x.target||55);
 return highSales?(highMargin?'STAR':'PLOW HORSE'):(highMargin?'PUZZLE':'DOG');
}
function builderClassPill(x){if(!(+x.price>0))return '<span class="pill amber">Needs price</span>';const c=builderClassification(x);return `<span class="pill ${c==='DOG'?'red':c==='PLOW HORSE'?'amber':''}">${c}</span>`}
function setBuilderStep(n){menuBuilderState.step=n;renderMenuBuilder()}
function builderAddQuickDish(){

}
function moveBuilderItem(id,dir){

 [menuBuilderState.items[i],menuBuilderState.items[next.idx]]=[menuBuilderState.items[next.idx],menuBuilderState.items[i]];renderMenuBuilder();
}

v></div><div class="formGrid" style="margin-top:12px"><div class="field"><label>Packaging</label><input type="number" value="${esc(x.pack)}" oninput="updateBuilderItem('${x.id}','pack',this.value);renderMenuBuilder()"></div><div class="field"><label>Other direct cost</label><input type="number" value="${esc(x.other)}" oninput="updateBuilderItem('${x.id}','other',this.value);renderMenuBuilder()"></div></div></div></div>`})():'<div class="empty">Create dishes in Step 2 first.</div>'}</div><div class="studioPanel"><div class="sectionTitle">Price Simulator</div><div class="formGrid"><div class="field"><label>Dish</label><select id="simDish" onchange="builderSimulate()">${all.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Proposed price</label><input id="simPrice" type="number" step="0.01" oninput="builderSimulate()"></div><div class="field"><label>Expected monthly units</label><input id="simUnits" type="number" step="1" oninput="builderSimulate()"></div></div><div id="simResult" class="simResult"><div><b>—</b><span>Current contribution / month</span></div><div><b>—</b><span>Proposed contribution / month</span></div><div><b>—</b><span>Monthly change</span></div></div></div>`;

function builderReplaceIngredient(id,idx,col,val){const x=menuBuilderState.items.find(i=>String(i.id)===String(id));if(!x)return;const lines=String(x.raw||'').split(/\n/).filter(Boolean);if(!lines[idx])return;const p=lines[idx].split('|');p[col]=String(val);lines[idx]=p.join(' | ');x.raw=lines.join('\n');renderMenuBuilder()}

}

let cameraStream=null;
function openCamera(){
 const body=`

 <div style="background:#07111d;border-radius:14px;overflow:hidden;position:relative">

 </div>

 </div>`;

async function startCamera(){
 const video=document.getElementById('cameraVideo');
 if(!video)return;
 try{
   cameraStream=await navigator.mediaDevices.getUserMedia({
     video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},
     audio:false
   });
   video.srcObject=cameraStream;
 }catch(err){
   const e=document.getElementById('cameraError');
   e.innerHTML='<div class="alert"><b>Camera could not be opened.</b><small>Please allow camera access in your browser. If this is a desktop without a camera, use Choose Image instead.</small></div>';
 }
}
function captureInvoicePhoto(){
 const video=document.getElementById('cameraVideo');
 const canvas=document.getElementById('cameraCanvas');
 if(!video||!video.videoWidth){document.getElementById('cameraError').innerHTML='<div class="alert"><b>Camera is not ready yet.</b><small>Please wait a moment and try again.</small></div>';return}
 canvas.width=video.videoWidth;canvas.height=video.videoHeight;
 canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);
 canvas.toBlob(blob=>{
   if(!blob)return;
   stopCamera();
   closeModal();
   const file=new File([blob],'camera-invoice.jpg',{type:'image/jpeg'});
   setTimeout(()=>processInvoiceFile(file),120);
 },'image/jpeg',.92);
}
function stopCamera(){
 if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}
}
function closeCamera(){stopCamera();closeModal()}
function handleInvoiceDrop(e){e.preventDefault();e.currentTarget.classList.remove('drag');processInvoiceFile(e.dataTransfer.files[0])}
async function processInvoiceFile(file){
 if(!file)return;
 let progress=document.getElementById('invoiceProgress');
 if(!progress){openInvoiceUpload();progress=document.getElementById('invoiceProgress')}
 progress.innerHTML='<div class="extractStatus"><span class="spin"></span> Preparing document…</div>';
 if(file.type==='application/pdf'){previewInvoice(file,null);return}
 const reader=new FileReader();
 reader.onload=async e=>{
   const data=e.target.result;
   previewInvoice(file,data);
   progress.innerHTML='<div class="extractStatus"><span class="spin"></span> Reading invoice text…</div>';
   let text='';
   try{
     if(window.Tesseract){
       const result=await Tesseract.recognize(data,'eng',{logger:m=>{
         if(m.status==='recognizing text') progress.innerHTML=`<div class="extractStatus"><span class="spin"></span> Reading document… ${Math.round((m.progress||0)*100)}%</div>`;
       }});
       text=result.data.text||'';
     }
   }catch(err){}
   const parsed=parseInvoiceText(text,file.name);
   showInvoiceReview({fileName:file.name,fileType:file.type,preview:data,rawText:text,...parsed});
 };
 reader.readAsDataURL(file);
}
function previewInvoice(file,data){
 const progress=document.getElementById('invoiceProgress');
 progress.innerHTML=(data?`<img class="preview" src="${data}" alt="Invoice preview">`:`<div class="notice"><b>${esc(file.name)}</b><br>PDF received. In this browser-only build the PDF is captured for review; connect server-side OCR in production for automatic PDF text extraction.</div>`);
 setTimeout(()=>{if(file.type==='application/pdf')showInvoiceReview({fileName:file.name,fileType:file.type,rawText:'',supplier:'',number:'',date:today(),currency:db.setup.currency,total:0,category:'Food Purchase',items:[]})},100);
}
function parseInvoiceText(text,fileName){
 const t=(text||'').replace(/\r/g,'');
 const lines=t.split('\n').map(x=>x.trim()).filter(Boolean);
 const find=re=>{const m=t.match(re);return m?m[1].trim():''};
 let supplier=find(/(?:supplier|vendor|from)\s*[:#-]?\s*([^\n]+)/i);
 if(!supplier && lines.length)supplier=lines[0];
 let number=find(/(?:invoice|receipt)\s*(?:no|number|#)?\s*[:#-]?\s*([A-Z0-9-]{3,})/i);
 let date=find(/(\d{1,2}[\/.-]\d{1,2}[\/.-]\d{2,4})/);
 if(date){let parts=date.split(/[\/.-]/);if(parts.length===3){let [a,b,c]=parts;if(c.length===2)c='20'+c;date=(c.length===4?(+a>12?`${c}-${String(b).padStart(2,'0')}-${String(a).padStart(2,'0')}`:`${c}-${String(a).padStart(2,'0')}-${String(b).padStart(2,'0')}`):today())}}
 let totalStr=find(/(?:grand\s*total|invoice\s*total|total\s*due|total)\s*[:\-]?\s*(?:K|ZMW|USD|\$|R|ZAR|NGN|₦)?\s*([\d,]+(?:\.\d{1,2})?)/i);
 let total=totalStr?parseFloat(totalStr.replace(/,/g,'')):0;
 let items=[];
 lines.forEach(line=>{
   const m=line.match(/^(.+?)\s+(\d+(?:\.\d+)?)\s+(?:x\s+)?(?:K|ZMW|USD|\$|R|NGN|₦)?\s*(\d[\d,]*(?:\.\d{1,2})?)\s*$/i);
   if(m && !/total|subtotal|tax|vat/i.test(line)) items.push({name:m[1].trim(),qty:parseFloat(m[2]),unitCost:parseFloat(m[3].replace(/,/g,''))});
 });

   });

<script>
/* Calytron fixes layer */
function cell(v){if(typeof v==='string'&&/^<(span class="pill|button)/.test(v))return v;return v==null||v===''?'—':esc(v)}
function switchModuleTab(id){const root=document.querySelector('.view.active');root.querySelectorAll('.moduleTab').forEach(b=>{const on=(b.getAttribute('onclick')||'').includes("'"+id+"'");b.classList.toggle('active',on);b.setAttribute('aria-selected',on)});root.querySelectorAll('.modulePanel').forEach(p=>p.classList.toggle('active',p.dataset.panel===id))}
const _om=openModal;openModal=function(t,b){document.getElementById('modal').classList.remove('studio');_om(t,b)};
const _cm=closeModal;closeModal=function(){_cm();document.getElementById('modal').classList.remove('studio')};
const _rmb=renderMenuBuilder;
renderMenuBuilder=function(){
 if(!menuBuilderState)return;const m=document.getElementById('modal'),box=m.querySelector('.modalBox'),ae=document.activeElement;let sig=null;
 if(ae&&m.contains(ae)&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)){const all=[...m.querySelectorAll('input,textarea,select')];let s=null,e=null;try{s=ae.selectionStart;e=ae.selectionEnd}catch(_){}sig={i:all.indexOf(ae),s,e}}
 const top=box?box.scrollTop:0;_rmb();m.classList.add('studio');m.querySelector('.menuStudioPro')?.classList.toggle('single',menuBuilderState.step===5);
 const nb=m.querySelector('.modalBox');if(nb)nb.scrollTop=top;
 if(sig&&sig.i>=0){const el=[...m.querySelectorAll('input,textarea,select')][sig.i];if(el){el.focus();try{if(sig.s!=null)el.setSelectionRange(sig.s,sig.e)}catch(_){}}}
};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('modal').classList.contains('open'))closeModal()});
document.getElementById('modal').addEventListener('mousedown',e=>{if(e.target.id==='modal'&&!e.currentTarget.classList.contains('studio'))closeModal()});
</script>
<script>
/* Calytron operations layer: stock, currency, backup, alerts */
function invAdj(name,d){const x=db.inventory.find(i=>i.name.toLowerCase()===String(name||'').trim().toLowerCase());if(x)x.qty=+((+x.qty||0)+d).toFixed(4)}
const _sf=submitForm;submitForm=function(e,type,id){const arr=type==='sale'?db.sales:type==='waste'?db.waste:null,before=arr?arr.length:-1;_sf(e,type,id);if(id||!arr||arr.length<=before)return;const r=arr[arr.length-1];
 if(type==='sale'){const m=db.menu.find(x=>x.name.toLowerCase()===String(r.item).trim().toLowerCase());r._ded=(m?m.ings||[]:[]).filter(i=>i.name&&i.qty).map(i=>({n:i.name,q:i.qty*r.qty}))}else r._ded=[{n:r.item,q:r.qty}];
 r._ded.forEach(d=>invAdj(d.n,-d.q));save()};
const _del=del;del=function(k,id,l){const r=(db[k]||[]).find(x=>x.id===id);_del(k,id,l);if(r&&r._ded&&!db[k].some(x=>x.id===id)){r._ded.forEach(d=>invAdj(d.n,d.q));save()}};
function uncosted(){const n=new Set(db.menu.map(m=>m.name.toLowerCase()));return db.sales.filter(x=>!n.has(String(x.item).trim().toLowerCase())).length}
function uncostedNotice(){const n=uncosted();return n?`<div class="alert warn" style="margin-bottom:16px"><b>${n} sale${n>1?'s have':' has'} no recipe cost</b><small>Add ${n>1?'those items':'that item'} to Menu Profit, otherwise food cost and gross profit look better than they are.</small></div>`:''}
['Dashboard','Food','Profit'].forEach(n=>{const f=window['render'+n],id=n.toLowerCase();window['render'+n]=function(){f();document.getElementById(id).insertAdjacentHTML('afterbegin',uncostedNotice())}});
const _rd=renderDashboard;renderDashboard=function(){_rd();const r=revenue();if(r<=0)return;const sec=document.getElementById('dashboard'),cards=sec.querySelector('.grid.cards');if(!cards)return;
 const parts=[['Food',r-grossProfit(),'#b08a45'],['Labor',laborCost(),'#0f5c49'],['Expenses',expenses(),'#7f9d92'],['Waste',wasteCost(),'#b4443a']];const net=r-parts.reduce((a,p)=>a+p[1],0);parts.push([net<0?'Loss':'Profit',Math.max(0,net),'#12201b']);const tot=parts.reduce((a,p)=>a+Math.max(0,p[1]),0)||1;
 cards.insertAdjacentHTML('afterend',`<div class="card" style="margin-top:16px"><div class="sectionTitle">Where every ${money(100).replace('.00','')} of sales goes</div><div style="display:flex;height:16px;border-radius:99px;overflow:hidden;gap:2px">${parts.map(p=>`<span title="${p[0]}" style="width:${Math.max(0,p[1])/tot*100}%;background:${p[2]}"></span>`).join('')}</div><div style="display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:14px">${parts.map(p=>`<div><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${p[2]};margin-right:7px"></span>${p[0]} <b style="font:400 20px var(--serif);margin-left:4px">${money(p[1]/r*100)}</b></div>`).join('')}</div></div>`)};
const _cip=confirmInvoicePost;confirmInvoicePost=function(t){const c=document.querySelector('[name="invCurrency"]'),base=db.setup.currency;
 if(c&&c.value!==base){const rate=parseFloat(prompt(`1 ${c.value} equals how many ${base}? This invoice will be recorded in ${base}.`));if(!(rate>0)){alert('Enter a valid exchange rate to continue.');return}
  document.querySelectorAll('#invoiceItems .ilCost').forEach(i=>i.value=((+i.value||0)*rate).toFixed(2));const tt=document.querySelector('[name="invTotal"]');tt.value=((+tt.value||0)*rate).toFixed(2);c.value=base}
 _cip(t)};
const _ra=renderAlerts;renderAlerts=function(){_ra();const low=db.inventory.filter(x=>(+x.min||0)>0&&(+x.qty||0)<=(+x.min||0));if(!low.length)return;const sec=document.getElementById('alerts');sec.querySelector('.card.empty')?.remove();
 sec.insertAdjacentHTML('beforeend',low.map(x=>`<div class="alert warn" style="margin-bottom:12px"><b>Low stock: ${esc(x.name)}</b><small>${x.qty} ${esc(x.unit)} left, minimum ${x.min}.</small><div style="margin-top:9px"><button class="btn sm" onclick="showView('inventory')">Open inventory</button></div></div>`).join(''))};
const _rs=renderSettings;renderSettings=function(){_rs();document.getElementById('settings').insertAdjacentHTML('beforeend','<div class="card" style="margin-top:16px"><div class="sectionTitle">Backup</div><p style="color:var(--muted)">Your data lives only in this browser. Download a copy regularly, or restore one here.</p><div class="actions"><button class="btn primary" onclick="exportData()">Download backup</button><button class="btn" onclick="importData()">Restore from backup</button></div></div>')};
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,1)],{type:'application/json'}));a.download='calytron-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||typeof d!=='object'||!d.setup||!Array.isArray(d.sales))throw 0;if(!confirm('Replace all current data with this backup?'))return;db=d;save();location.reload()}catch(e){alert('That file is not a Calytron backup.')}};r.readAsText(f)};i.click()}
</script>
<script>
/* Reliable save: optional fields, visible validation, confirmation toast */
function toast(m){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2400)}
const OPT=['ref','discount','staff','location','note','notes','contact','phone','email','address','description','items','pack','other','total','overtime','min','max','supplier','cost','opening','cash','card','mobile','delivery','till','actual'];
const _of=openForm;openForm=function(t,id){_of(t,id);const f=document.querySelector('#modalBody form');if(!f)return;f.noValidate=true;OPT.forEach(n=>{if(f.elements[n]&&f.elements[n].tagName)f.elements[n].required=false});f.addEventListener('input',e=>e.target.classList&&e.target.classList.remove('invalid'))};
const _sf2=submitForm;submitForm=function(e,type,id){const f=e.target;
 if(type==='sale'&&f.ref&&!f.ref.value.trim())f.ref.value='S-'+String(db.sales.length+1).padStart(4,'0');
 f.querySelectorAll('.invalid').forEach(x=>x.classList.remove('invalid'));f.querySelectorAll('.formError').forEach(x=>x.remove());
 const bad=[...f.elements].filter(x=>x.name&&x.checkValidity&&!x.checkValidity());
 if(type==='sale'&&f.qty&&+f.qty.value<=0&&!bad.includes(f.qty))bad.push(f.qty);
 if(bad.length){e.preventDefault();bad.forEach(x=>x.classList.add('invalid'));const names=bad.map(x=>(x.closest('.field')?.querySelector('label')?.textContent||x.name));
  f.lastElementChild.insertAdjacentHTML('beforebegin','<div class="formError" role="alert">Please complete: '+names.map(esc).join(', ')+'</div>');bad[0].focus();return}
 _sf2(e,type,id);if(!document.getElementById('modal').classList.contains('open'))toast(type==='sale'?'Sale recorded':'Saved successfully')};
</script>
<script>
/* Start fresh: clear demo records, keep business setup */
function startFresh(){if(!confirm('Remove ALL demo records (sales, menu, stock, expenses, staff, suppliers, invoices) and start with an empty business? Your restaurant setup is kept. Tip: download a backup first.'))return;Object.keys(db).forEach(k=>{if(Array.isArray(db[k]))db[k]=[]});save();location.reload()}
const _rs2=renderSettings;renderSettings=function(){_rs2();document.getElementById('settings').insertAdjacentHTML('beforeend','<div class="card" style="margin-top:16px"><div class="sectionTitle">Go live</div><p style="color:var(--muted)">Ready to use Calytron for your own restaurant? Clear the demo records and begin with an empty business. Set your restaurant name and currency in Setup first.</p><div class="actions"><button class="btn danger" onclick="startFresh()">Start fresh with empty data</button></div></div>')};

showView('dashboard');
</script>
<script>
/* Calytron cloud layer: Supabase auth + per-user sync (falls back to local mode if not configured) */
let sb=null,uid=null,uemail='',_pt=null;
const SK='calytron_owner',ST='calytron_stamp';
function badge(txt,cls){let b=document.getElementById('syncBadge');if(!b){const t=document.querySelector('.top');if(!t)return;b=document.createElement('span');b.id='syncBadge';b.className='syncBadge';t.insertBefore(b,t.lastElementChild)}b.textContent=txt;b.className='syncBadge '+(cls||'')}
function gate(show,mode){let g=document.getElementById('authGate');if(!g){g=document.createElement('div');g.id='authGate';g.innerHTML='<form class="authCard" id="authForm" novalidate><div class="mark">C</div><h2 id="authTitle">Welcome back</h2><p id="authSub">Sign in to your restaurant workspace.</p><div class="field"><label>Email</label><input name="email" type="email" autocomplete="email" required></div><div class="field" id="pwField"><label>Password</label><input name="password" type="password" autocomplete="current-password" minlength="6"></div><div class="authMsg" id="authMsg" role="alert"></div><button class="btn primary" id="authBtn">Sign in</button><div class="authLinks"><a id="authSwap">Create an account</a><a id="authForgot">Forgot password?</a></div></form>';document.body.appendChild(g);
 let signup=false;const msg=(t,ok)=>{const m=document.getElementById('authMsg');m.textContent=t;m.className='authMsg'+(ok?' ok':'')};
 const setMode=x=>{signup=x;authTitle.textContent=x?'Create your workspace':'Welcome back';authSub.textContent=x?'Start tracking profit in minutes.':'Sign in to your restaurant workspace.';authBtn.textContent=x?'Create account':'Sign in';authSwap.textContent=x?'I already have an account':'Create an account';msg('')};
 authSwap.onclick=()=>setMode(!signup);
 authForgot.onclick=async()=>{const e=authForm.email.value.trim();if(!e)return msg('Enter your email first.');const {error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin});msg(error?error.message:'Reset link sent. Check your email.',!error)};
 authForm.onsubmit=async ev=>{ev.preventDefault();const e=authForm.email.value.trim(),p=authForm.password.value;if(!e||p.length<6)return msg('Enter your email and a password of at least 6 characters.');authBtn.disabled=true;msg('');
  try{if(signup){const {data,error}=await sb.auth.signUp({email:e,password:p,options:{emailRedirectTo:location.origin}});if(error)msg(error.message);else if(!data.session)msg('Account created. Check your email to confirm, then sign in.',true)}
  else{const {error}=await sb.auth.signInWithPassword({email:e,password:p});if(error)msg(error.message)}}catch(x){msg('Network problem. Check your connection and try again.')}
  authBtn.disabled=false}}
 g.classList.toggle('show',!!show)}
async function pushNow(){if(!sb||!uid)return;clearTimeout(_pt);badge('Saving…','busy');const stamp=Date.now();try{const {error}=await sb.from('app_state').upsert({user_id:uid,data:db,updated_at:new Date(stamp).toISOString()});if(error)throw error;localStorage.setItem(ST,stamp);badge('Synced')}catch(e){badge('Not synced: will retry','err');_pt=setTimeout(pushNow,15000)}}
const _save3=save;save=function(){_save3();if(sb&&uid){badge('Saving…','busy');clearTimeout(_pt);_pt=setTimeout(pushNow,900)}};
addEventListener('pagehide',()=>{if(_pt)pushNow()});addEventListener('online',()=>{if(sb&&uid)pushNow()});
async function syncDown(){const {data,error}=await sb.from('app_state').select('data,updated_at').eq('user_id',uid).maybeSingle();if(error){badge('Sync error','err');return}
 const owner=localStorage.getItem(SK),local=+localStorage.getItem(ST)||0;
 if(data){const remote=Date.parse(data.updated_at);if(owner!==uid||remote>local){localStorage.setItem(KEY,JSON.stringify(data.data));localStorage.setItem(SK,uid);localStorage.setItem(ST,remote);location.reload();return}if(local>remote)await pushNow();else badge('Synced')}
 else{if(owner!==uid)Object.keys(db).forEach(k=>{if(Array.isArray(db[k]))db[k]=[]});localStorage.setItem(KEY,JSON.stringify(db));localStorage.setItem(SK,uid);await pushNow();showView('dashboard')}}
async function onSession(s){if(!s||!s.user||uid===s.user.id)return;uid=s.user.id;uemail=s.user.email||'';gate(false);badge('Syncing…','busy');await syncDown()}
async function signOutNow(){if(_pt)await pushNow();await sb.auth.signOut();[KEY,SK,ST].forEach(k=>localStorage.removeItem(k));location.reload()}
const _rs3=renderSettings;renderSettings=function(){_rs3();if(!sb)return;document.getElementById('settings').insertAdjacentHTML('afterbegin','<div class="card" style="margin-bottom:16px"><div class="sectionTitle">Account</div><p style="color:var(--muted)">Signed in as <b>'+esc(uemail)+'</b>. Your data syncs securely to your private cloud workspace.</p><div class="actions"><button class="btn" onclick="pushNow()">Sync now</button><button class="btn danger" onclick="signOutNow()">Sign out</button></div></div>')};
(async()=>{const c=window.CALYTRON_CONFIG||{};if(!c.url||!c.anonKey||/YOUR-/.test(c.url+c.anonKey)||!window.supabase){badge('Local mode','off');return}
 sb=window.supabase.createClient(c.url,c.anonKey,{auth:{persistSession:true,autoRefreshToken:true}});gate(true);
 sb.auth.onAuthStateChange((ev,s)=>{if(ev==='SIGNED_OUT'){uid=null;gate(true)}else if(s)onSession(s)});
 const {data}=await sb.auth.getSession();if(data&&data.session)onSession(data.session)})();
</script>
