function cwName(c){try{return new Intl.DisplayNames(['en'],{type:'currency'}).of(c)||c}catch(e){return c}}
function cwSym(c){return CW_SYM[c]||c}
function cwDec(c){try{return new Intl.NumberFormat('en',{style:'currency',currency:c}).resolvedOptions().maximumFractionDigits}catch(e){return 2}}
function cwDetect(){try{const tz=Intl.DateTimeFormat().resolvedOptions().timeZone||'';let ctry=CW_TZ[tz];if(!ctry&&/^Australia\//.test(tz))ctry='Australia';if(!ctry&&/^America\/(New_York|Chicago|Denver|Los_Angeles|Phoenix|Anchorage|Detroit|Boise|Indiana|Kentucky|Menominee|North_Dakota|Juneau)/.test(tz)||tz==='Pacific/Honolulu')ctry='United States';if(!ctry){const r=(navigator.language||'').split('-')[1];if(r)ctry=new Intl.DisplayNames(['en'],{type:'region'}).of(r.toUpperCase())}return CW_C[ctry]||'USD'}catch(e){return 'USD'}}
function cwCountry(){try{const tz=Intl.DateTimeFormat().resolvedOptions().timeZone||'';if(CW_TZ[tz])return CW_TZ[tz];if(/^Australia\//.test(tz))return 'Australia';if(/^America\/(New_York|Chicago|Denver|Los_Angeles|Phoenix|Anchorage|Detroit|Boise)/.test(tz))return 'United States'}catch(e){}return ''}

function cwCountryOpts(sel){const names=Object.keys(CW_C).sort();const list=!sel||names.includes(sel)?names:[sel,...names];return '<option value="">Select country…</option>'+list.map(n=>'<option'+(n===sel?' selected':'')+'>'+n.replace(/&/g,'&amp;')+'</option>').join('')}
function cwFmt(n,c){c=c||cwDetect();const d=cwDec(c);return cwSym(c)+' '+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d})}

home(){const b=S.brand,act=S.camps.filter(c=>!['cancelled','completed'].includes(c.status)).sort((a,c)=>(a.start||'').localeCompare(c.start||'')),costed=S.menu.filter(m=>mg(m)!=null).sort((a,c)=>mg(c)/c.price-mg(a)/a.price).slice(0,3),R=[];
 if(!b.name)R.push(['Add your restaurant profile so campaigns use your name and voice','brand']);
 if(!S.menu.length)R.push(['Add menu items to choose what to promote','brand']);else if(!costed.length)R.push(['Add food costs so discounts can be checked against margin','brand']);
 else R.push([`Consider promoting ${esc(costed[0].name)}: it has your highest margin of the costed dishes`,'strategy']);
 if(!S.camps.length)R.push(['Create your first campaign','strategy']);
 return `<div class="c hero"><div><h1>Turn your best dishes into full tables.</h1><p>${b.name?esc(b.name)+': c':'C'}hoose what to promote, check the margin, create the post, then count the results.</p><button onclick="newD();go('strategy')">Create campaign</button><button class="s" onclick="go('studio')">Open Content Studio</button><button class="s" onclick="go('guide')">How it works</button></div><div id="fxh" class="fxh" role="img" aria-label="Animated glowing plate that reacts to your campaigns"></div><div class="fxchips" aria-hidden="true"><span style="--d:0s"><b>${S.camps.length}</b> campaigns</span><span style="--d:-2s"><b>${S.menu.length}</b> dishes</span><span style="--d:-4s"><b>${S.camps.filter(c=>c.res).length}</b> tracked</span></div></div><div class="glance">${[[S.menu.length,'menu items'],[S.camps.length,'campaigns'],[S.guests.filter(g=>g.ok).length,'opted-in guests'],[S.camps.filter(c=>c.res).length,'with results logged']].map(([n,l])=>`<div class="gl"><b>${n}</b><span>${l}</span></div>`).join('')}</div>
 <div class="g">${planCard()}<div class="c"><h2>Recommended next steps</h2>${R.map(r=>`<div class="row"><span>${r[0]}</span><button class="s" onclick="go('${r[1]}')">Open</button></div>`).join('')}</div>
 <div class="c"><h2>Active and upcoming</h2>${act.slice(0,5).map(c=>`<div class="row"><span>${esc(c.name)}<br><small class="mu">${esc(PM[c.platform]||c.platform)} · ${esc(c.start||'no date')}</small></span><span class="tag">${SM[c.status]}</span></div>`).join('')||'<p class="mu">No campaigns yet. Saved campaigns appear here and in the Planner.</p>'}</div>
 <div class="c"><h2>Top dishes to promote</h2>${costed.map(m=>`<div class="row"><span>${esc(m.name)}</span><span class="tag g1">margin ${money(mg(m))} (${(mg(m)/m.price*100).toFixed(0)}%)</span></div>`).join('')||'<p class="mu">Needs menu items with food costs. Nothing is guessed.</p>'}</div>
 <div class="c"><h2>Performance</h2><p class="mu">Unavailable: no analytics source is connected. Engagement and repeat-visit figures will only appear from real data.</p><button class="s" onclick="go('insights')">See how it will work</button></div>
 <div class="c"><h2>Recent activity</h2>${S.log.map(l=>`<div class="row"><span>${esc(l.m)}</span><small class="mu">${esc(l.t)}</small></div>`).join('')||'<p class="mu">Nothing yet.</p>'}</div>
 <div class="c"><h2>Integrations</h2><p><span class="tag">0 of 8 connected</span></p><p class="mu">Nothing posts to external platforms. Export creatives and publish manually.</p><button class="s" onclick="go('integrations')">Review status</button></div></div>
 <p class="note">Data is saved only in this browser. ${(S.camps.length||S.guests.length)&&(!S.lb||(Date.now()-new Date(S.lb))/864e5>14)?'It has not been backed up in the last 14 days. <button class="l" onclick="backupData()">Back up now</button>':'Keep a backup: iPhone Safari can erase site data after about a week without a visit.'}</p>`},
strategy(){const items=S.menu.map(m=>`<option>${esc(m.name)}</option>`).join('');
 return `<h1>Campaign strategist</h1><p class="mu">Answer three quick questions. Recommendations are editable and based only on data you have entered.</p><div class="g2"><div class="c">
 <label>What should I promote?</label><input list="dl" value="${esc(ST.dish)}" oninput="ST.dish=this.value;paintStrat()" placeholder="Choose a menu item or type a dish"><datalist id="dl">${items}</datalist>
 <label>Goal</label>${sel(GL,ST.goal,"ST.goal=this.value;paintStrat()")}

 ${ST.type=='pct'?`<label>Discount %</label><input type="number" min="1" max="90" value="${ST.pct}" oninput="ST.pct=Math.min(90,Math.max(1,+this.value||1));paintStrat()">`:''}
 ${ST.type=='text'?`<label>Offer wording</label><input value="${esc(ST.offer)}" oninput="ST.offer=this.value" placeholder="e.g. Free dessert with a main">`:''}

 <div class="c" id="sr"></div></div>`},

<style>
#cgGate{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:20px;background:radial-gradient(900px 500px at 80% -10%,rgba(16,185,129,.18),transparent 60%),radial-gradient(800px 500px at 0% 110%,rgba(214,168,79,.14),transparent 60%),#0B1220;overflow:auto;font:15px/1.5 'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:#E8ECF4}
#cgGate.show{display:flex}
#cgGate .card{width:min(420px,100%);background:#141B2B;border:1px solid #2A3550;border-radius:20px;padding:34px 30px;box-shadow:0 40px 80px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05)}
#cgGate .mk{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:700 24px Fraunces,Georgia,serif;color:#2a1f08;background:radial-gradient(circle at 30% 25%,#f4dc9b,#D6A84F 70%);box-shadow:0 0 0 4px rgba(214,168,79,.2);margin-bottom:18px}
#cgGate h1{font:600 30px/1.1 Fraunces,Georgia,serif;margin:0 0 6px}
#cgGate p.s{color:#93A0BA;margin:0 0 20px;font-size:14.5px}
#cgGate label{display:block;font-size:12.5px;font-weight:700;color:#C5CEDF;margin:0 0 6px}
#cgGate .f{margin-bottom:14px}
#cgGate input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #2A3550;background:#0B1220;color:#E8ECF4;font:500 16px inherit;box-sizing:border-box}
#cgGate input:focus{outline:none;border-color:#D6A84F;box-shadow:0 0 0 4px rgba(214,168,79,.22)}
#cgGate .pw{position:relative}#cgGate .pw input{padding-right:48px}
#cgGate .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;background:transparent;color:#93A0BA;cursor:pointer;border-radius:9px;display:grid;place-items:center;padding:0}
#cgGate .eye{background:transparent!important;box-shadow:none!important;border:0!important;transform:translateY(-50%)!important;min-height:0}#cgGate .eye:hover{color:#fff;background:rgba(255,255,255,.08)!important}#cgGate .eye svg{width:20px;height:20px}
#cgGate .go{width:100%;margin-top:6px;padding:15px;border:0;border-radius:12px;font:700 15px inherit;color:#04130d;cursor:pointer;background:linear-gradient(180deg,#34d399,#10B981);box-shadow:0 5px 0 #0a7a55,0 14px 24px rgba(0,0,0,.3)}
#cgGate .go:active{transform:translateY(4px);box-shadow:0 1px 0 #0a7a55}
#cgGate .go:disabled{opacity:.7;cursor:progress}
#cgGate .msg{min-height:20px;margin:4px 0 6px;font-size:13.5px;color:#F2736B}#cgGate .msg.ok{color:#34d399}
#cgGate .lk{display:flex;justify-content:space-between;gap:10px;margin-top:16px;font-size:13.5px}
#cgGate .lk a{color:#D6A84F;cursor:pointer;font-weight:700;text-decoration:none}#cgGate .lk a:hover{text-decoration:underline}
#cgGate .fine{margin:18px 0 0;font-size:11.5px;color:#7d8aa5;text-align:center}
#cgBar{position:fixed;top:10px;right:12px;z-index:8000;display:none;align-items:center;gap:10px;padding:7px 8px 7px 14px;border-radius:999px;background:rgba(20,27,43,.92);border:1px solid #2A3550;font:600 12px 'DM Sans',system-ui,sans-serif;color:#93A0BA;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#cgBar.show{display:flex}#cgBar b{color:#E8ECF4;font-weight:600;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#cgBar i{font-style:normal;color:#34d399}#cgBar i.w{color:#D6A84F}#cgBar i.e{color:#F2736B}
#cgBar button{border:0;border-radius:999px;padding:6px 12px;background:#1C2538;color:#E8ECF4;font:700 12px inherit;cursor:pointer}#cgBar button:hover{background:#2A3550}
@media(max-width:520px){#cgBar b{display:none}#cgGate .card{padding:28px 22px}}

 function init(){

  sb.auth.onAuthStateChange(function(ev,session){if(session&&(ev==='SIGNED_IN'||ev==='INITIAL_SESSION'||ev==='TOKEN_REFRESHED')){boot(session)}else if(ev==='SIGNED_OUT'&&booted){try{localStorage.removeItem(LS);localStorage.removeItem(OWN)}catch(e){}location.reload()}else if(ev==='INITIAL_SESSION'&&!session){showGate()}});
  setTimeout(function(){if(!booted&&!gate.classList.contains('show')){sb.auth.getSession().then(function(r){if(r&&r.data&&r.data.session)boot(r.data.session);else showGate()})}},1500);
 }
 function load(u,next){var s=document.createElement('script');s.src=u;s.onload=init;s.onerror=next;document.head.appendChild(s)}
 setMode('in');showGate();
 load('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js',function(){load('https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js',function(){msg('Could not reach the sign-in service. Check your internet and reload.')})});
})();
</script>
